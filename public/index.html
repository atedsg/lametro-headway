<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LA Metro Vehicle Raw Data Monitor</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: monospace;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      padding: 12px 24px;
      background: #f59e0b;
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .section-title {
      color: #38bdf8;
      margin-top: 20px;
      font-size: 18px;
    }
    pre {
      background: #1e293b;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #334155;
      overflow-x: auto;
      color: #a7f3d0;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🚌 LA Metro API Raw Data Inspector</h2>
  <div class="search-box">
    <input type="text" id="vehicleIdInput" placeholder="차량 번호 입력 (예: 4038)" value="4038">
    <button onclick="fetchRawData()">조회</button>
  </div>

  <div id="status">차량 번호를 입력하고 조회 버튼을 누르세요.</div>

  <div class="section-title">📌 내 차량 원본 객체 (Target Vehicle Raw)</div>
  <pre id="myRawData">// 조회 결과가 여기에 표시됩니다.</pre>

  <div class="section-title">🚌 동일 노선 전체 차량 목록 (Same Route Raw List)</div>
  <pre id="allRawData">// 동일 노선 운행 차량 전체 데이터가 여기에 표시됩니다.</pre>
</div>

<script>
  async function fetchRawData() {
    const vehicleId = document.getElementById('vehicleIdInput').value.trim();
    if (!vehicleId) return;

    document.getElementById('status').innerText = '데이터 가져오는 중...';

    try {
      const res = await fetch(`/api/headway?vehicle_id=${vehicleId}`);
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || '조회 실패');
      }

      const data = await res.json();

      document.getElementById('status').innerText = 
        `갱신: ${new Date(data.timestamp).toLocaleTimeString()} | 노선 내 총 ${data.total_same_route_count}대 운행 중`;

      // 내 차량 원본 JSON 구조 렌더링
      document.getElementById('myRawData').innerText = 
        JSON.stringify(data.my_vehicle_raw, null, 2);

      // 같은 노선 전체 차량 원본 JSON 렌더링
      document.getElementById('allRawData').innerText = 
        JSON.stringify(data.all_route_vehicles_raw, null, 2);

    } catch (err) {
      document.getElementById('status').innerText = `오류: ${err.message}`;
    }
  }

  fetchRawData();
</script>

</body>
</html>
